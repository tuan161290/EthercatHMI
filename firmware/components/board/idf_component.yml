# Versions pinned to the ones the vendor LVGL demo resolved and built on IDF 5.5.4
# (docs/BOARD.md 3.2: the vendor manifest uses "*").
# IDF 6.0 moved the IP101 PHY driver out of IDF into the registry (migration guide 5.5 -> 6.0,
# Networking), so it comes from there on IDF 6.
dependencies:
  idf: ">=5.5,<7.0"
  espressif/esp_lcd_jd9165: "2.0.2"
  espressif/esp_lcd_touch_gt911: "1.2.1"
  espressif/esp_lcd_touch:
    version: "1.2.1"
    public: true
  espressif/ip101:
    version: "1.1.0"
    rules:
      - if: "idf_version >=6.0"
