# go2rtc that receives the HMI's push from the Internet (docs/CAMERA.md section 5). Copy this file
# as go2rtc.yaml into the dataset that compose.yaml mounts for "ingest", then change the password.
#
# The router forwards one port (the DDNS port) to this instance only. It asks every client for the
# login and serves a single path:
#   POST /api/stream.mjpeg?dst=ehmi   the HMI pushes its JPEG frames (Settings > Camera > Send to server)
#   GET  /api/stream.mjpeg?src=ehmi   the LAN go2rtc (go2rtc.yaml) takes them from here
# Everything else of go2rtc (web page, stream editing, exec sources) stays off on this port.

api:
  listen: ":1984"
  username: "ehmi"
  # Letters and digits only: go2rtc.yaml puts it into a URL. Type the same one on the HMI.
  password: "ChangeMeToALongRandomPassword"
  allow_paths:
    - /api/stream.mjpeg

# Not needed here (internal/rtsp/rtsp.go: an empty address switches it off). The other listeners
# of go2rtc are not published by compose.yaml.
rtsp:
  listen: ""

streams:
  ehmi: # empty: the HMI's POST is its source
