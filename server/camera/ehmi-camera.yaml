# EtherCAT HMI camera: TrueNAS SCALE custom app (24.10 or later).
# Apps > Discover Apps > (menu) > Install via YAML, name "ehmi-camera", paste this whole file.
# docs/CAMERA.md section 5.
#
# Uses the official go2rtc image; everything of this app lives in one folder on the NAS
# (SMB: \\<NAS>\tuan\ESP32CAM):
#   config/ingest/go2rtc.yaml   the Internet side: login (the HMI uses the same password)
#   config/lan/go2rtc.yaml      the LAN side: web page and RTSP
#   recordings/                 10-minute MP4 files
# Edit those files over SMB, then restart the app. This file only needs a change if the folder,
# the Internet port (8556) or TZ / KEEP_DAYS change.
#
# Services (all share the network of "net", so they reach each other at 127.0.0.1):
#   net       holds the network and the published ports and does nothing else, so it never
#             restarts and the others keep their network when one of them restarts.
#   ingest    go2rtc reached from the Internet: the router forwards the DDNS port to NAS 8556.
#             It asks for the login and serves only /api/stream.mjpeg, where the HMI POSTs its
#             frames.
#   go2rtc    LAN side: takes the stream from ingest, web page http://<NAS>:1984, RTSP
#             rtsp://<NAS>:8554/ehmi, H.264 for the recorder. Do not forward 1984 or 8554.
#   recorder  10-minute MP4 files (fragmented: a cut leaves a playable file); deletes the ones
#             older than KEEP_DAYS.

x-common: &common
  image: alexxit/go2rtc:1.9.14
  restart: unless-stopped
  environment:
    TZ: Asia/Ho_Chi_Minh

services:
  net:
    <<: *common
    command: ["sleep", "infinity"]
    ports:
      - "8556:8556" # Internet: the router forwards the DDNS port here (ingest)
      - "1984:1984" # LAN only: go2rtc web page and API
      - "8554:8554" # LAN only: RTSP

  ingest:
    <<: *common
    network_mode: "service:net"
    depends_on:
      - net
    volumes:
      - /mnt/FAMILY/TUAN/ESP32CAM/config/ingest:/config

  go2rtc:
    <<: *common
    network_mode: "service:net"
    depends_on:
      - ingest
    volumes:
      - /mnt/FAMILY/TUAN/ESP32CAM/config/lan:/config

  recorder:
    <<: *common
    network_mode: "service:net"
    depends_on:
      - go2rtc
    environment:
      TZ: Asia/Ho_Chi_Minh
      KEEP_DAYS: "14"
    volumes:
      - /mnt/FAMILY/TUAN/ESP32CAM/recordings:/recordings
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        (while true; do
          find /recordings -type f -name 'ehmi-*.mp4' -mtime +$$KEEP_DAYS -delete
          sleep 3600
        done) &
        while true; do
          ffmpeg -hide_banner -loglevel warning -rtsp_transport tcp -i rtsp://127.0.0.1:8554/ehmi_h264 \
            -c copy -f segment -segment_time 600 -segment_atclocktime 1 -reset_timestamps 1 \
            -segment_format mp4 -segment_format_options movflags=+frag_keyframe+empty_moov+default_base_moof \
            -strftime 1 /recordings/ehmi-%Y%m%d-%H%M%S.mp4
          echo "no stream yet (camera off or not pushing); trying again in 10 s"
          sleep 10
        done
