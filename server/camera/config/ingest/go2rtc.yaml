# go2rtc "ingest": the only part of the camera app reached from the Internet (docs/CAMERA.md 5).
# The router forwards the DDNS port to NAS port 8556. Every client must log in, and only one path
# exists here:
#   POST /api/stream.mjpeg?dst=ehmi   the HMI pushes its JPEG frames (Settings > Camera > Send to server)
#   GET  /api/stream.mjpeg?src=ehmi   the LAN go2rtc takes them (from 127.0.0.1, which needs no login)
# The web page, stream editing and exec sources do not exist on this port.

api:
  listen: ":8556"
  username: "ehmi"
  # Letters and digits only. Type the same one on the HMI (Send to server > Password).
  password: "ChangeMeToALongRandomPassword"
  allow_paths:
    - /api/stream.mjpeg

# Off: this instance shares its network with the LAN go2rtc (ehmi-camera.yaml), whose ports these
# would take. An empty address switches a listener off (go2rtc 1.9.14 rtsp.go, srtp.go, webrtc.go).
rtsp:
  listen: ""
webrtc:
  listen: ""
srtp:
  listen: ""

streams:
  ehmi: # empty: the HMI's POST is its source
