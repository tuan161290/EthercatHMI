# go2rtc on the LAN side of the camera app (docs/CAMERA.md 5): web page http://<NAS>:1984,
# RTSP rtsp://<NAS>:8554/ehmi, and H.264 for the recorder. Do not forward these ports.

api:
  listen: ":1984"

rtsp:
  listen: ":8554"

# Not needed (the web page plays through the API port)
webrtc:
  listen: ""
srtp:
  listen: ""

streams:
  # From the ingest go2rtc, over 127.0.0.1 (same network): no login needed from there.
  ehmi: http://127.0.0.1:8556/api/stream.mjpeg?src=ehmi
  # Or, when the NAS is on the HMI's LAN, straight from the HMI (the "Stream" line of
  # Settings > Camera):
  # ehmi: http://192.168.1.50/stream

  # The same picture as H.264 for the recorder, encoded here by ffmpeg
  ehmi_h264: ffmpeg:ehmi#video=h264
