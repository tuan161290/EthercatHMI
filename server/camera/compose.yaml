# EtherCAT HMI camera on TrueNAS SCALE: Apps > Discover Apps > (menu) > Install via YAML.
# docs/CAMERA.md section 5 has the steps. Change the dataset paths, the port and TZ before installing.
#
# - ingest: receives the HMI's push from the Internet. The router forwards the DDNS port to it, and
#   nothing else. Login and the single allowed path are in ingest.yaml.
# - go2rtc: LAN side. Takes the stream from ingest, shows it at http://<NAS>:1984 and hands H.264 to
#   the recorder. Do not forward its ports.
# - recorder: writes 10-minute MP4 files (fragmented, so a cut leaves a playable file) and deletes
#   the ones older than KEEP_DAYS. It uses the ffmpeg inside the go2rtc image.

services:
  ingest:
    image: alexxit/go2rtc:1.9.14
    restart: unless-stopped
    environment:
      - TZ=Asia/Ho_Chi_Minh
    ports:
      - "8556:1984" # the router forwards the DDNS port here (any free port; the HMI's address uses it)
    volumes:
      - /mnt/tank/apps/go2rtc-ingest:/config # holds ingest.yaml, renamed go2rtc.yaml

  go2rtc:
    image: alexxit/go2rtc:1.9.14
    restart: unless-stopped
    depends_on:
      - ingest
    environment:
      - TZ=Asia/Ho_Chi_Minh
    ports:
      - "1984:1984" # web page and API (LAN only)
      - "8554:8554" # RTSP (LAN only)
    volumes:
      - /mnt/tank/apps/go2rtc:/config # holds go2rtc.yaml

  recorder:
    image: alexxit/go2rtc:1.9.14
    restart: unless-stopped
    depends_on:
      - go2rtc
    environment:
      - TZ=Asia/Ho_Chi_Minh
      - KEEP_DAYS=14
    volumes:
      - /mnt/tank/camera:/recordings
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        (while true; do
          find /recordings -type f -name 'ehmi-*.mp4' -mtime +$$KEEP_DAYS -delete
          sleep 3600
        done) &
        while true; do
          ffmpeg -hide_banner -loglevel warning -rtsp_transport tcp -i rtsp://go2rtc:8554/ehmi_h264 \
            -c copy -f segment -segment_time 600 -segment_atclocktime 1 -reset_timestamps 1 \
            -segment_format mp4 -segment_format_options movflags=+frag_keyframe+empty_moov+default_base_moof \
            -strftime 1 /recordings/ehmi-%Y%m%d-%H%M%S.mp4
          echo "stream not available (camera off or not pushing); trying again in 10 s"
          sleep 10
        done
